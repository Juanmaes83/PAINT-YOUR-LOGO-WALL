name: Validate V3 Original Effects

on:
  push:
    branches: [agent/logo-crew-v3-original-effects]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout original-effects branch
        uses: actions/checkout@v4
        with:
          ref: agent/logo-crew-v3-original-effects
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install and build
        run: |
          npm install
          npm run build
          node --check src/v3/donors/grass/grass-original-core.js
          node --check src/v3/adapters/grass-adapter.js
          node --check src/v3-effect-engine.js
          node --check src/v23-jobs.js
          node --check scripts/visual-check-v3.mjs
      - name: Record code provenance and weight
        run: |
          mkdir -p artifacts
          {
            echo "branch=$(git branch --show-current)"
            echo "head=$(git rev-parse HEAD)"
            echo "grass_donor_blob=91b6441f8cb31f6ff79f14a8cc0d4ab375c929a1"
            echo "grass_donor_path=labs/source-experiences/grass-image-processing-pro/source-script.js"
            echo "--- files ---"
            wc -c src/v3/donors/grass/grass-original-core.js src/v3/adapters/grass-adapter.js src/v3-effect-engine.js src/v23-jobs.js scripts/visual-check-v3.mjs
            echo "--- diff from stable V3 ---"
            git diff --stat origin/agent/logo-crew-v3...HEAD || true
          } | tee artifacts/original-effects-build-info.txt
      - name: Install Chromium and FFmpeg
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate dynamic media fixtures
        run: |
          mkdir -p artifacts/fixtures
          ffmpeg -loglevel error -y -f lavfi -i "testsrc2=size=640x360:rate=30:duration=4" -vf "hue=h=0:s=1" -c:v libx264 -pix_fmt yuv420p -movflags +faststart artifacts/fixtures/v23-a.mp4
          ffmpeg -loglevel error -y -f lavfi -i "testsrc=size=640x360:rate=30:duration=4" -vf "hue=h=90:s=1.2" -c:v libvpx-vp9 -pix_fmt yuv420p artifacts/fixtures/v23-b.webm
          ffmpeg -loglevel error -y -f lavfi -i "testsrc2=size=640x360:rate=30:duration=4" -vf "hue=h=180:s=1.3" -c:v libx264 -pix_fmt yuv420p -movflags +faststart artifacts/fixtures/v23-c.mp4
      - name: Start V3 preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4178 > /tmp/v3-original-effects.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4178/PAINT-YOUR-LOGO-WALL/v3/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/v3-original-effects.log; exit 1
      - name: Browser QA original effects
        env:
          PYLW_URL: http://127.0.0.1:4178/PAINT-YOUR-LOGO-WALL/v3/
          PYLW_FIXTURES: artifacts/fixtures
        run: npm run verify:browser
      - name: Upload QA evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paint-your-logo-wall-original-effects-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: error
