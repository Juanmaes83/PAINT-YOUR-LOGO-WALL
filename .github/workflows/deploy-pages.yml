name: Deploy Paint Your Logo Wall Versions

on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout V1
        uses: actions/checkout@v4
        with: { ref: agent/logo-crew-v1, path: v1-src }
      - name: Checkout V2
        uses: actions/checkout@v4
        with: { ref: agent/logo-crew-v2, path: v2-src }
      - name: Checkout V2.1
        uses: actions/checkout@v4
        with: { ref: agent/logo-crew-v2-1, path: v21-src }
      - name: Checkout V2.2
        uses: actions/checkout@v4
        with: { ref: agent/logo-crew-v2-2, path: v22-src }
      - name: Checkout V2.3
        uses: actions/checkout@v4
        with: { ref: agent/logo-crew-v2-3, path: v23-src }
      - name: Checkout V3
        uses: actions/checkout@v4
        with: { ref: agent/logo-crew-v3, path: v3-src }
      - name: Checkout V3 original-effects review
        uses: actions/checkout@v4
        with: { ref: agent/logo-crew-v3-original-effects, path: v3-original-src }
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build V1
        working-directory: v1-src
        env: { GITHUB_PAGES: true }
        run: |
          npm install
          npm run build
          node --check src/main.js
      - name: Build V2
        working-directory: v2-src
        env: { GITHUB_PAGES: true }
        run: |
          npm install
          npm run build
          node --check src/main.js
          node --check src/v2-runtime.js
          node --check src/v2-jobs.js
      - name: Build V2.1
        working-directory: v21-src
        env: { GITHUB_PAGES: true }
        run: |
          npm install
          npm run build
          node --check src/main.js
          node --check src/v21-runtime.js
          node --check src/v21-style-engine.js
          node --check src/v21-tools.js
          node --check src/v2-jobs.js
          node --check scripts/visual-check-v21.mjs
      - name: Build V2.2
        working-directory: v22-src
        env: { GITHUB_PAGES: true }
        run: |
          npm install
          npm run build
          node --check src/main.js
          node --check src/v22-runtime.js
          node --check src/v22-media.js
          node --check src/v22-project-store.js
          node --check src/v2-jobs.js
          node --check src/crew-library.js
          node --check scripts/visual-check-v22.mjs
      - name: Build V2.3
        working-directory: v23-src
        env: { GITHUB_PAGES: true }
        run: |
          npm install
          npm run build
          node --check src/main.js
          node --check src/v23-runtime.js
          node --check src/v23-jobs.js
          node --check src/v23-background.js
          node --check src/v23-project-store.js
          node --check src/v22-media.js
          node --check src/v21-style-engine.js
          node --check src/v21-tools.js
          node --check src/crew-library.js
          node --check scripts/visual-check-v23.mjs
      - name: Build V3
        working-directory: v3-src
        env: { GITHUB_PAGES: true }
        run: |
          npm install
          npm run build
          node --check src/main.js
          node --check src/v23-runtime.js
          node --check src/v23-jobs.js
          node --check src/v23-background.js
          node --check src/v23-project-store.js
          node --check src/v22-media.js
          node --check src/v21-style-engine.js
          node --check src/v21-tools.js
          node --check src/crew-library.js
          node --check scripts/visual-check-v23.mjs
      - name: Build V3 original-effects review
        working-directory: v3-original-src
        env: { GITHUB_PAGES: true }
        run: |
          npm install
          npm run build
          node --check src/main.js
          node --check src/v23-runtime.js
          node --check src/v23-jobs.js
          node --check src/v3-effect-engine.js
          node --check src/v3/adapters/grass-adapter.js
          node --check src/v3/adapters/particles-adapter.js
          node --check src/v3/adapters/liquid-adapter.js
          node --check src/v3/adapters/pixel-adapter.js
          node --check scripts/visual-check-v3.mjs

      - name: Install Chromium and FFmpeg
        working-directory: v3-original-src
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Generate V2.2 fixtures
        working-directory: v22-src
        run: |
          mkdir -p artifacts/fixtures
          ffmpeg -loglevel error -y -f lavfi -i "color=c=red:s=640x360:d=2:r=30" -c:v libx264 -pix_fmt yuv420p -movflags +faststart artifacts/fixtures/video-a.mp4
          ffmpeg -loglevel error -y -f lavfi -i "color=c=blue:s=640x360:d=2:r=30" -c:v libvpx-vp9 -pix_fmt yuv420p artifacts/fixtures/video-b.webm
          ffmpeg -loglevel error -y -f lavfi -i "color=c=green:s=640x360:d=2:r=30" -c:v libx264 -pix_fmt yuv420p -movflags +faststart artifacts/fixtures/video-c.mp4

      - name: Generate dynamic V2.3 media fixtures
        working-directory: v23-src
        run: |
          mkdir -p artifacts/fixtures
          ffmpeg -loglevel error -y -f lavfi -i "testsrc2=size=640x360:rate=30:duration=4" -vf "hue=h=0:s=1" -c:v libx264 -pix_fmt yuv420p -movflags +faststart artifacts/fixtures/v23-a.mp4
          ffmpeg -loglevel error -y -f lavfi -i "testsrc=size=640x360:rate=30:duration=4" -vf "hue=h=90:s=1.2" -c:v libvpx-vp9 -pix_fmt yuv420p artifacts/fixtures/v23-b.webm
          ffmpeg -loglevel error -y -f lavfi -i "testsrc2=size=640x360:rate=30:duration=4" -vf "hue=h=180:s=1.3" -c:v libx264 -pix_fmt yuv420p -movflags +faststart artifacts/fixtures/v23-c.mp4
          ffmpeg -loglevel error -y -f lavfi -i "testsrc2=size=1280x720:rate=30:duration=4" -vf "hue=h=250:s=.8" -c:v libx264 -pix_fmt yuv420p -movflags +faststart artifacts/fixtures/v23-bg.mp4
          for f in artifacts/fixtures/v23-a.mp4 artifacts/fixtures/v23-b.webm artifacts/fixtures/v23-c.mp4 artifacts/fixtures/v23-bg.mp4; do ffprobe -v error -show_entries stream=codec_name,width,height -of compact "$f"; done
      - name: Copy stable fixtures to V3 variants
        run: |
          mkdir -p v3-src/artifacts v3-original-src/artifacts
          cp -R v23-src/artifacts/fixtures v3-src/artifacts/fixtures
          cp -R v23-src/artifacts/fixtures v3-original-src/artifacts/fixtures

      - name: Start V1 preview
        working-directory: v1-src
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/v1.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/PAINT-YOUR-LOGO-WALL/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/v1.log; exit 1
      - name: QA V1 exact subpath
        working-directory: v1-src
        env: { QA_URL: http://127.0.0.1:4173/PAINT-YOUR-LOGO-WALL/ }
        run: npm run verify:browser

      - name: Start V2 preview
        working-directory: v2-src
        run: |
          npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/v2.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4174/PAINT-YOUR-LOGO-WALL/v2/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/v2.log; exit 1
      - name: QA V2 exact subpath
        working-directory: v2-src
        env: { PYLW_URL: http://127.0.0.1:4174/PAINT-YOUR-LOGO-WALL/v2/ }
        run: npm run verify:browser

      - name: Start V2.1 preview
        working-directory: v21-src
        run: |
          npm run preview -- --host 127.0.0.1 --port 4175 > /tmp/v21.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4175/PAINT-YOUR-LOGO-WALL/v2-1/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/v21.log; exit 1
      - name: QA V2.1 exact subpath
        working-directory: v21-src
        env: { PYLW_URL: http://127.0.0.1:4175/PAINT-YOUR-LOGO-WALL/v2-1/ }
        run: npm run verify:browser

      - name: Start V2.2 preview
        working-directory: v22-src
        run: |
          npm run preview -- --host 127.0.0.1 --port 4176 > /tmp/v22.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4176/PAINT-YOUR-LOGO-WALL/v2-2/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/v22.log; exit 1
      - name: QA V2.2 exact subpath with three videos
        working-directory: v22-src
        env:
          PYLW_URL: http://127.0.0.1:4176/PAINT-YOUR-LOGO-WALL/v2-2/
          PYLW_FIXTURES: artifacts/fixtures
        run: npm run verify:browser

      - name: Start V2.3 preview
        working-directory: v23-src
        run: |
          npm run preview -- --host 127.0.0.1 --port 4177 > /tmp/v23.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4177/PAINT-YOUR-LOGO-WALL/v2-3/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/v23.log; exit 1
      - name: QA V2.3 runtime stability and rendered live media
        working-directory: v23-src
        env:
          PYLW_URL: http://127.0.0.1:4177/PAINT-YOUR-LOGO-WALL/v2-3/
          PYLW_FIXTURES: artifacts/fixtures
        run: npm run verify:browser
      - name: Upload V2.3 QA evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paint-your-logo-wall-v2-3-validation-${{ github.run_attempt }}
          path: v23-src/artifacts
          if-no-files-found: warn

      - name: Start V3 preview
        working-directory: v3-src
        run: |
          npm run preview -- --host 127.0.0.1 --port 4178 > /tmp/v3.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4178/PAINT-YOUR-LOGO-WALL/v3/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/v3.log; exit 1
      - name: QA V3 cloned stable baseline
        working-directory: v3-src
        env:
          PYLW_URL: http://127.0.0.1:4178/PAINT-YOUR-LOGO-WALL/v3/
          PYLW_FIXTURES: artifacts/fixtures
        run: npm run verify:browser
      - name: Upload V3 QA evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paint-your-logo-wall-v3-validation-${{ github.run_attempt }}
          path: v3-src/artifacts
          if-no-files-found: warn

      - name: Start V3 original-effects preview
        working-directory: v3-original-src
        run: |
          npm run preview -- --host 127.0.0.1 --port 4179 > /tmp/v3-original.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4179/PAINT-YOUR-LOGO-WALL/v3/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/v3-original.log; exit 1
      - name: QA V3 original-effects review
        working-directory: v3-original-src
        env:
          PYLW_URL: http://127.0.0.1:4179/PAINT-YOUR-LOGO-WALL/v3/
          PYLW_FIXTURES: artifacts/fixtures
        run: npm run verify:browser
      - name: Upload V3 original-effects QA evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paint-your-logo-wall-v3-original-effects-pages-${{ github.run_attempt }}
          path: v3-original-src/artifacts
          if-no-files-found: warn

      - name: Compose versioned Pages site
        run: |
          mkdir -p deploy-site/v2 deploy-site/v2-1 deploy-site/v2-2 deploy-site/v2-3 deploy-site/v3 deploy-site/v3-original-effects
          cp -R v1-src/dist/. deploy-site/
          cp -R v2-src/dist/. deploy-site/v2/
          cp -R v21-src/dist/. deploy-site/v2-1/
          cp -R v22-src/dist/. deploy-site/v2-2/
          cp -R v23-src/dist/. deploy-site/v2-3/
          cp -R v3-src/dist/. deploy-site/v3/
          cp -R v3-original-src/dist/. deploy-site/v3-original-effects/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: deploy-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait for public versions
        run: |
          for i in {1..50}; do
            if curl -fsS https://juanmaes83.github.io/PAINT-YOUR-LOGO-WALL/ >/dev/null && curl -fsS https://juanmaes83.github.io/PAINT-YOUR-LOGO-WALL/v2/ >/dev/null && curl -fsS https://juanmaes83.github.io/PAINT-YOUR-LOGO-WALL/v2-1/ >/dev/null && curl -fsS https://juanmaes83.github.io/PAINT-YOUR-LOGO-WALL/v2-2/ >/dev/null && curl -fsS https://juanmaes83.github.io/PAINT-YOUR-LOGO-WALL/v2-3/ >/dev/null && curl -fsS https://juanmaes83.github.io/PAINT-YOUR-LOGO-WALL/v3/ >/dev/null && curl -fsS https://juanmaes83.github.io/PAINT-YOUR-LOGO-WALL/v3-original-effects/ >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: QA public V1
        working-directory: v1-src
        env: { QA_URL: https://juanmaes83.github.io/PAINT-YOUR-LOGO-WALL/ }
        run: npm run verify:browser
      - name: QA public V2
        working-directory: v2-src
        env: { PYLW_URL: https://juanmaes83.github.io/PAINT-YOUR-LOGO-WALL/v2/ }
        run: npm run verify:browser
      - name: QA public V2.1
        working-directory: v21-src
        env: { PYLW_URL: https://juanmaes83.github.io/PAINT-YOUR-LOGO-WALL/v2-1/ }
        run: npm run verify:browser
      - name: QA public V2.2 with three videos
        working-directory: v22-src
        env:
          PYLW_URL: https://juanmaes83.github.io/PAINT-YOUR-LOGO-WALL/v2-2/
          PYLW_FIXTURES: artifacts/fixtures
        run: npm run verify:browser
      - name: QA public V2.3 runtime stability and rendered live media
        working-directory: v23-src
        env:
          PYLW_URL: https://juanmaes83.github.io/PAINT-YOUR-LOGO-WALL/v2-3/
          PYLW_FIXTURES: artifacts/fixtures
        run: npm run verify:browser
      - name: QA public V3 cloned stable baseline
        working-directory: v3-src
        env:
          PYLW_URL: https://juanmaes83.github.io/PAINT-YOUR-LOGO-WALL/v3/
          PYLW_FIXTURES: artifacts/fixtures
        run: npm run verify:browser
      - name: QA public V3 original-effects review
        working-directory: v3-original-src
        env:
          PYLW_URL: https://juanmaes83.github.io/PAINT-YOUR-LOGO-WALL/v3-original-effects/
          PYLW_FIXTURES: artifacts/fixtures
        run: npm run verify:browser
